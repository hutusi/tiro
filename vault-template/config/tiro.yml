# Tiro vault configuration.
#
# llm: any OpenAI-compatible chat-completions endpoint works here.
#   api_key_env names the environment variable carrying the key — set it as a
#   GitHub Actions secret with the same name (see README.md).
llm:
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus
  # Optional per-task overrides:
  # summary_model: qwen-max
  # translation_model: qwen-mt-plus
  api_key_env: TIRO_LLM_API_KEY
  # Per HTTP request, not per logical call — the client retries. A timed-out
  # request is only ever retried once (a timeout has already spent its full
  # budget), so one stuck call costs at most 2x this.
  timeout_ms: 120000
  max_retries: 3

# The LLM picks exactly one category per article from this list.
categories:
  - tech
  - ai
  - programming
  - product
  - science
  - business
  - culture
  - life
  - other

translation:
  # zh is the only supported target: the artifact is always zh.md and the
  # language detector only tells Chinese from non-Chinese.
  target: zh
  # Articles whose Han-character ratio reaches this threshold are treated as
  # already-Chinese and are not translated.
  cjk_threshold: 0.3
  # Chars of source text per translation LLM call. Tune per provider: bigger
  # batches mean fewer (faster) calls, but the translated output must fit the
  # provider's per-request output cap — raise cautiously (e.g. 20000-30000),
  # lower if you see "batch marker mismatch" lines in the workflow log.
  batch_chars: 10000

processing:
  # Wall-clock budget for one run, and the reason the workflow's
  # timeout-minutes is 60: the processor must stop itself with room to spare so
  # it can flush its translation checkpoints and let the commit step run. A run
  # killed by the job cap commits nothing.
  #
  # An article that runs out of budget keeps its checkpoint
  # (articles/<slug>/.tiro-zh-cache.json) and resumes on the next run instead
  # of restarting, so very long articles finish across several runs.
  run_budget_ms: 3000000 # 50 min

images:
  max_bytes: 10485760 # 10 MB per image; larger ones stay hotlinked
  timeout_ms: 20000
  # Stage-wide caps. Without them one image-heavy article can run the job past
  # its timeout-minutes, and a killed run repeats the whole download next push.
  max_count: 100
  total_max_bytes: 104857600 # 100 MB per article
  stage_timeout_ms: 300000 # 5 min for the whole image stage

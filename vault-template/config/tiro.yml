# Tiro vault configuration.
#
# llm: any OpenAI-compatible chat-completions endpoint works here.
#   api_key_env names the environment variable carrying the key — set it as a
#   GitHub Actions secret with the same name (see README.md).
llm:
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus
  # Optional per-task overrides:
  # summary_model: qwen-max
  # translation_model: qwen-mt-plus
  api_key_env: TIRO_LLM_API_KEY

# The LLM picks exactly one category per article from this list.
categories:
  - tech
  - ai
  - programming
  - product
  - science
  - business
  - culture
  - life
  - other

translation:
  target: zh
  # Articles whose Han-character ratio reaches this threshold are treated as
  # already-Chinese and are not translated.
  cjk_threshold: 0.3
  # Chars of source text per translation LLM call. Tune per provider: bigger
  # batches mean fewer (faster) calls, but the translated output must fit the
  # provider's per-request output cap — raise cautiously (e.g. 20000-30000),
  # lower if you see "batch marker mismatch" lines in the workflow log.
  batch_chars: 10000

images:
  max_bytes: 10485760 # 10 MB per image; larger ones stay hotlinked
  timeout_ms: 20000

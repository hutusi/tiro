name: Process articles

on:
  push:
    branches: [main]
    paths: ["articles/**"]
  workflow_dispatch:
    inputs:
      force:
        description: "Reprocess even if already marked processed"
        type: boolean
        default: false
      slug:
        description: "Only process this article slug"
        type: string
        default: ""

# Serialize runs; queued (not cancelled) so a clip landing mid-run still gets
# its own run afterwards.
concurrency:
  group: tiro-process
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    # Backstop only. The processor stops itself first, at
    # `processing.run_budget_ms` in config/tiro.yml (50 min by default), so it
    # can flush its translation checkpoints and let the commit step run. This
    # cap exists for the case where that fails; keep it comfortably above the
    # budget, or a kill lands mid-article on every run.
    timeout-minutes: 60
    steps:
      # ref: main, not the default trigger SHA — queued runs (concurrency
      # serializes them) would otherwise check out a vault that predates the
      # previous run's commit-back, re-process its articles, and then fail
      # the push with a rebase conflict against that commit.
      - uses: actions/checkout@v4
        with:
          path: vault
          ref: main

      # The processor code lives in the tiro monorepo. If tiro is private,
      # add a read-scoped PAT here via `token:`.
      - uses: actions/checkout@v4
        with:
          repository: hutusi/tiro
          path: tiro

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
        working-directory: tiro

      - name: Run the processor
        working-directory: tiro
        env:
          # Must match llm.api_key_env in config/tiro.yml. If you rename it
          # there, rename this key too — the processor looks up whatever name
          # the config gives, and nothing here bridges the two.
          TIRO_LLM_API_KEY: ${{ secrets.TIRO_LLM_API_KEY }}
          # Dispatch inputs reach the script as data, never as source. Actions
          # substitutes ${{ }} into the run block before bash parses it, so an
          # interpolated slug would execute in a job holding contents: write
          # and the LLM key.
          FORCE: ${{ inputs.force }}
          SLUG: ${{ inputs.slug }}
        run: |
          args=(--vault "$GITHUB_WORKSPACE/vault")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ -n "$SLUG" ]; then args+=(--slug "$SLUG"); fi
          bun run process -- "${args[@]}"

      # Pushes made with the default GITHUB_TOKEN do not retrigger workflows,
      # so committing back here cannot loop. The rebase-retry absorbs a clip
      # that landed while this run was working.
      - name: Commit results back
        id: commit
        # always(): a job killed by timeout-minutes must still commit what it
        # achieved. Without this the kill discarded every finished article and
        # every translation checkpoint in the run, so a long article restarted
        # from nothing on each retry and could never finish.
        if: always()
        working-directory: vault
        run: |
          git config user.name "tiro-processor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "process: summarize and translate new articles"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          # -X theirs: if a concurrent commit touched the same article (e.g.
          # a re-clip mid-run), both sides are valid content — prefer this
          # run's version rather than failing and discarding the whole run.
          # (In a rebase, "theirs" is the commit being replayed, i.e. ours.)
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $attempt), rebasing"
            git pull --rebase -X theirs
          done
          git push

      - name: Trigger site deploy
        # Gate on a commit actually landing, not on job success: a run that
        # committed real work and was then killed by timeout-minutes still has
        # something to publish.
        if: always() && steps.commit.outcome == 'success' && steps.commit.outputs.committed == 'true'

        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.TIRO_DISPATCH_TOKEN }}
          repository: hutusi/tiro
          event-type: vault-updated

name: Process articles

on:
  push:
    branches: [main]
    # inbox/: a link saved from a phone or the extension's "Clip link" is a
    # file there, and the run turns it into an article (ADR 0034).
    paths: ["articles/**", "inbox/**"]
  workflow_dispatch:
    inputs:
      force:
        description: "Reprocess even if already marked processed"
        type: boolean
        default: false
      slug:
        description: "Only process this article slug"
        type: string
        default: ""
  # Daily, so an article the run budget deferred is finished without waiting
  # for the next clip (ADR 0032). Off the hour, when scheduled runs queue
  # longest. A run with nothing pending takes about a minute and deploys
  # nothing. Scheduled runs use the default branch.
  schedule:
    - cron: "17 3 * * *"

# Serialize runs; queued (not cancelled) so a clip landing mid-run still gets
# its own run afterwards.
concurrency:
  group: tiro-process
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    # Backstop only. The processor stops itself first, at
    # `processing.run_budget_ms` in config/tiro.yml (50 min by default), so it
    # can flush its translation checkpoints and let the commit step run. This
    # cap exists for the case where that fails; keep it comfortably above the
    # budget, or a kill lands mid-article on every run.
    timeout-minutes: 60
    steps:
      # ref: main, not the default trigger SHA — queued runs (concurrency
      # serializes them) would otherwise check out a vault that predates the
      # previous run's commit-back, re-process its articles, and then fail
      # the push with a rebase conflict against that commit.
      - uses: actions/checkout@v7
        with:
          path: vault
          ref: main

      # The processor code lives in the tiro monorepo. If tiro is private,
      # add a read-scoped PAT here via `token:`.
      - uses: actions/checkout@v7
        with:
          repository: hutusi/tiro
          path: tiro

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
        working-directory: tiro

      - name: Run the processor
        id: process
        working-directory: tiro
        env:
          # Must match llm.api_key_env in config/tiro.yml. If you rename it
          # there, rename this key too — the processor looks up whatever name
          # the config gives, and nothing here bridges the two.
          TIRO_LLM_API_KEY: ${{ secrets.TIRO_LLM_API_KEY }}
          # Dispatch inputs reach the script as data, never as source. Actions
          # substitutes ${{ }} into the run block before bash parses it, so an
          # interpolated slug would execute in a job holding contents: write
          # and the LLM key.
          FORCE: ${{ inputs.force }}
          SLUG: ${{ inputs.slug }}
        run: |
          # Recorded on articles made from saved links: this checkout is the
          # code that clips their pages (ADR 0034).
          TIRO_COMMIT="$(git describe --always)"
          export TIRO_COMMIT
          args=(--vault "$GITHUB_WORKSPACE/vault")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ -n "$SLUG" ]; then args+=(--slug "$SLUG"); fi
          bun run process -- "${args[@]}"

      # Pushes made with the default GITHUB_TOKEN do not retrigger workflows,
      # so committing back here cannot loop. The rebase-retry absorbs a clip
      # that landed while this run was working, and an article removed while
      # it was working (ADR 0036).
      #
      # Tested for real by packages/processor/test/commit-back.test.ts in the
      # tiro repo, which runs this block against scratch repositories.
      - name: Commit results back
        id: commit
        # always(): a job killed by timeout-minutes must still commit what it
        # achieved. Without this the kill discarded every finished article and
        # every translation checkpoint in the run, so a long article restarted
        # from nothing on each retry and could never finish.
        if: always()
        working-directory: vault
        # Named, so GitHub adds pipefail; a step with no shell runs `bash -e`.
        shell: bash
        run: |
          git config user.name "tiro-processor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # What "deleted while this run worked" is measured from: the commit
          # this run checked out.
          base="$(git rev-parse HEAD)"
          git commit -q -m "process: summarize and translate new articles"
          attempt=1
          while :; do
            # Recorded only once it is true: the deploy step reads it.
            if git push; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -ge 4 ]; then
              echo "::error::main refused this run's push $attempt times; its work is not in the vault"
              exit 1
            fi
            echo "push rejected (attempt $attempt), rebasing"
            attempt=$((attempt + 1))
            git fetch -q origin main
            # A deletion wins (ADR 0036). An article whose index.md main
            # deleted since `base` loses everything this run wrote under it:
            # a changed file would stop the rebase on a modify/delete conflict,
            # which -X theirs does not settle, and lose the whole run; an added
            # one would replay cleanly and bring the directory back as an
            # orphan. --no-renames, so a slug move reads as the deletion it is.
            # Assigned rather than looped over, so a failing diff ends the step.
            deleted="$(git -c core.quotePath=false diff --name-only --no-renames --diff-filter=D "$base" FETCH_HEAD -- ':(glob)articles/*/index.md')"
            while IFS= read -r index; do
              [ -n "$index" ] || continue
              dir="${index%/index.md}"
              if git diff --quiet HEAD~1 HEAD -- "$dir"; then continue; fi
              echo "::notice::$dir was deleted on main while this run worked on it; dropping this run's changes to it"
              # No-overlay: files this run added there go too, not just the
              # ones it changed.
              git restore --source=HEAD~1 --staged --worktree -- "$dir"
            done <<< "$deleted"
            if ! git diff --cached --quiet HEAD; then
              if git diff --cached --quiet HEAD~1; then
                echo "Everything this run wrote was under deleted articles; nothing left to commit"
                echo "committed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git commit -q --amend --no-edit
            fi
            # -X theirs: if a concurrent commit touched the same article (e.g.
            # a re-clip mid-run), both sides are valid content — prefer this
            # run's version rather than failing and discarding the whole run.
            # (In a rebase, "theirs" is the commit being replayed, i.e. ours.)
            if ! git rebase -q -X theirs FETCH_HEAD; then
              git rebase --abort
              echo "::error::rebasing onto main hit a conflict a deletion does not explain (a single file deleted by hand inside an article this run changed?); this run's work is not in the vault"
              exit 1
            fi
          done

      - name: Trigger site deploy
        # Gate on the commit step succeeding, not on job success: a run that
        # committed real work and was then killed by timeout-minutes still has
        # something to publish.
        #
        # A push or a manual run deploys even when this run committed nothing
        # (ADR 0032). Such a push is a hand edit — `unlisted`, a deletion, a
        # repair, a slug migration — and its content is already on main, so
        # there is nothing to process and everything to publish. The daily
        # run waits for a commit of its own: with nothing new, there is
        # nothing to publish.
        if: >-
          always() && steps.commit.outcome == 'success' &&
          (steps.commit.outputs.committed == 'true' ||
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch')
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.TIRO_DISPATCH_TOKEN }}
          repository: hutusi/tiro
          event-type: vault-updated

      # Last, and only here: by now the run's work is committed and deployed,
      # so failing the job loses nothing (invariant 7) — it only makes GitHub
      # send its failed-run email. The processor always exits 0 and reports
      # what went wrong through `failures`, which counts hard failures and
      # unreadable articles, never a budget deferral (ADR 0032). The run page's
      # summary names them.
      #
      # Only "0" is a clean run. A missing count means the processor never
      # said how it went — it crashed, or could not write its output — and an
      # outcome nobody knows is not one to stay green over.
      - name: Fail on article errors
        if: always() && steps.process.outputs.failures != '0'
        env:
          FAILURES: ${{ steps.process.outputs.failures }}
        run: |
          if [ -z "$FAILURES" ]; then
            echo "::error::The processor reported no failure count, so this run's outcome is unknown; see the Run the processor step"
          else
            echo "::error::$FAILURES article(s) failed or could not be read; the run summary names them"
          fi
          exit 1

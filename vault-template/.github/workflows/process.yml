name: Process articles

on:
  push:
    branches: [main]
    # inbox/: a link saved from a phone or the extension's "Clip link" is a
    # file there, and the run turns it into an article (ADR 0034).
    # sites/: a page saved as a site, which the run introduces (ADR 0055).
    paths: ["articles/**", "inbox/**", "sites/**"]
  workflow_dispatch:
    inputs:
      force:
        description: "Reprocess even if already marked processed"
        type: boolean
        default: false
      slug:
        description: "Only process this slug (sites/<slug> for a site alone)"
        type: string
        default: ""
  # Daily, so an article the run budget deferred is finished without waiting
  # for the next clip (ADR 0032). Off the hour, when scheduled runs queue
  # longest. A run with nothing pending takes about a minute and deploys
  # nothing. Scheduled runs use the default branch.
  schedule:
    - cron: "17 3 * * *"

# Serialize runs; queued (not cancelled) so a clip landing mid-run still gets
# its own run afterwards.
concurrency:
  group: tiro-process
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process:
    # Stood down when another host processes this vault (ADR 0046): the
    # repository variable TIRO_PROCESSOR set to `external`. A run started by
    # hand still runs — the fallback, and the way to force one slug — and a
    # job skipped here gets no runner, so it spends no minutes.
    if: vars.TIRO_PROCESSOR != 'external' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Backstop only. The processor stops itself first, at
    # `processing.run_budget_ms` in config/tiro.yml (50 min by default), so it
    # can flush its translation checkpoints and let the commit step run. This
    # cap exists for the case where that fails; keep it comfortably above the
    # budget, or a kill lands mid-article on every run.
    timeout-minutes: 60
    steps:
      # ref: main, not the default trigger SHA — queued runs (concurrency
      # serializes them) would otherwise check out a vault that predates the
      # previous run's commit-back, re-process its articles, and then fail
      # the push with a rebase conflict against that commit.
      - uses: actions/checkout@v7
        with:
          path: vault
          ref: main

      # The processor code lives in the tiro monorepo. If tiro is private,
      # add a read-scoped PAT here via `token:`.
      - uses: actions/checkout@v7
        with:
          repository: hutusi/tiro
          path: tiro

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
        working-directory: tiro

      - name: Run the processor
        id: process
        env:
          # Must match llm.api_key_env in config/tiro.yml. If you rename it
          # there, rename this key too — the processor looks up whatever name
          # the config gives, and nothing here bridges the two.
          TIRO_LLM_API_KEY: ${{ secrets.TIRO_LLM_API_KEY }}
          # Dispatch inputs reach the script as data, never as source. Actions
          # substitutes ${{ }} into the run block before bash parses it, so an
          # interpolated slug would execute in a job holding contents: write
          # and the LLM key.
          TIRO_FORCE: ${{ inputs.force }}
          TIRO_SLUG: ${{ inputs.slug }}
        run: bash "$GITHUB_WORKSPACE/tiro/packages/processor/job/process.sh" "$GITHUB_WORKSPACE/vault"

      # Pushes made with the default GITHUB_TOKEN do not retrigger workflows,
      # so committing back here cannot loop. What the step does — the
      # rebase-retry that absorbs a clip landed meanwhile, and a deletion on
      # main winning over this run's changes (ADR 0036) — is a script in
      # tiro, tested for real by packages/processor/test/commit-back.test.ts
      # through this very step.
      - name: Commit results back
        id: commit
        # always(): a job killed by timeout-minutes must still commit what it
        # achieved. Without this the kill discarded every finished article and
        # every translation checkpoint in the run, so a long article restarted
        # from nothing on each retry and could never finish.
        if: always()
        working-directory: vault
        shell: bash
        run: bash "$GITHUB_WORKSPACE/tiro/packages/processor/job/commit-back.sh"

      - name: Trigger site deploy
        # Gate on the commit step succeeding, not on job success: a run that
        # committed real work and was then killed by timeout-minutes still has
        # something to publish.
        #
        # Whether this run deploys at all is the script's to decide (ADR
        # 0032): a push or a manual run deploys even when it committed
        # nothing, and the daily run only when it committed something.
        if: always() && steps.commit.outcome == 'success'
        env:
          TIRO_TRIGGER: ${{ github.event_name }}
          TIRO_COMMITTED: ${{ steps.commit.outputs.committed }}
          TIRO_DISPATCH_TOKEN: ${{ secrets.TIRO_DISPATCH_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/tiro/packages/processor/job/deploy.sh"

      # Last, and only here: by now the run's work is committed and deployed,
      # so failing the job loses nothing (invariant 7) — it only makes GitHub
      # send its failed-run email. The processor always exits 0 and reports
      # what went wrong through `failures`, which counts hard failures and
      # unreadable articles, never a budget deferral (ADR 0032). The run page's
      # summary names them.
      #
      # Only "0" is a clean run. A missing count means the processor never
      # said how it went — it crashed, or could not write its output — and an
      # outcome nobody knows is not one to stay green over.
      - name: Fail on article errors
        if: always() && steps.process.outputs.failures != '0'
        env:
          FAILURES: ${{ steps.process.outputs.failures }}
        run: |
          if [ -z "$FAILURES" ]; then
            echo "::error::The processor reported no failure count, so this run's outcome is unknown; see the Run the processor step"
          else
            echo "::error::$FAILURES article(s) failed or could not be read; the run summary names them"
          fi
          exit 1

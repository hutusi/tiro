<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tiro</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: #1f2328;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 15px;
      }
      #status {
        color: #57606a;
        min-height: 18px;
      }
      #status.error {
        color: #cf222e;
      }
      #preview {
        margin: 10px 0;
        padding: 10px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
      }
      #article-title {
        font-weight: 600;
        margin-bottom: 4px;
        overflow-wrap: anywhere;
      }
      #article-meta {
        color: #57606a;
        font-size: 12px;
      }
      #warning {
        color: #9a6700;
        font-size: 12px;
        margin-top: 6px;
      }
      button {
        width: 100%;
        padding: 8px 0;
        border: none;
        border-radius: 6px;
        background: #1f883d;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        background: #94d3a2;
        cursor: default;
      }
      .links {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        font-size: 12px;
      }
      a,
      .linklike {
        color: #0969da;
        text-decoration: none;
        cursor: pointer;
      }
      button.linklike {
        width: auto;
        padding: 0;
        border: none;
        background: none;
        font-size: 12px;
        font-weight: 400;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Tiro</h1>
    <div id="status" role="status">Reading page…</div>
    <div id="preview" hidden>
      <div id="article-title"></div>
      <div id="article-meta"></div>
      <div id="warning" hidden>
        Readability could not extract an article; clipping the raw page instead.
      </div>
    </div>
    <button id="clip" type="button" disabled>Clip to vault</button>
    <div class="links">
      <a id="view" href="https://github.com/" target="_blank" hidden>View in vault</a>
      <button id="options" type="button" class="linklike">Settings</button>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>

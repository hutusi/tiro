<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tiro Settings</title>
    <style>
      body {
        max-width: 460px;
        margin: 40px auto;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        color: #1f2328;
      }
      h1 {
        font-size: 18px;
      }
      label {
        display: block;
        margin: 14px 0 4px;
        font-weight: 600;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        font-size: 14px;
        background: #fff;
      }
      .hint {
        color: #57606a;
        font-size: 12px;
        margin-top: 4px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 18px;
      }
      button {
        padding: 7px 14px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        background: #f6f8fa;
        font-size: 13px;
        cursor: pointer;
      }
      button.primary {
        background: #1f883d;
        border-color: #1f883d;
        color: #fff;
        font-weight: 600;
      }
      #result {
        margin-top: 12px;
        min-height: 18px;
      }
      #result.ok {
        color: #1a7f37;
      }
      #result.error {
        color: #cf222e;
      }
    </style>
  </head>
  <body>
    <h1 id="heading">Tiro Settings</h1>
    <label id="label-owner" for="owner">GitHub owner</label>
    <input id="owner" placeholder="your GitHub username" autocomplete="off" />
    <label id="label-repo" for="repo">Vault repository</label>
    <input id="repo" placeholder="your vault repository name" autocomplete="off" />
    <label id="label-branch" for="branch">Branch</label>
    <input id="branch" placeholder="main" autocomplete="off" />
    <label id="label-token" for="token">Fine-grained personal access token</label>
    <input id="token" type="password" autocomplete="off" />
    <div id="token-hint" class="hint">
      Scope the token to the vault repository only, with Contents: Read and
      write. It is stored in chrome.storage.local on this machine.
    </div>
    <label id="label-language" for="language">Language</label>
    <select id="language">
      <option value="auto">Auto (browser language)</option>
      <option value="en">English</option>
      <option value="zh">中文</option>
    </select>
    <div class="row">
      <button id="save" type="button" class="primary">Save</button>
      <button id="test" type="button">Test connection</button>
    </div>
    <div id="result"></div>
    <script type="module" src="./options.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tiro Settings</title>
    <style>
      /* Page-specific rules; the shared tokens and components come from
         src/ui/tokens.css, imported by options.ts. */
      body {
        min-height: 100vh;
        padding: 48px 16px;
        box-sizing: border-box;
      }
      .card {
        max-width: 460px;
        margin: 0 auto;
        padding: 24px;
        border: 1px solid var(--rule);
        border-radius: 12px;
        background: var(--field);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 22px;
      }
      #heading {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .hint {
        margin: 5px 0 14px;
      }
      .row {
        margin-top: 22px;
      }
      #result {
        margin: 12px 0 0;
        min-height: 18px;
        font-size: 13px;
        color: var(--ink-soft);
      }
      #result.ok {
        color: var(--ok);
      }
      #result.error {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <header class="bar">
        <span class="logo-bars" aria-hidden="true"><i></i><i></i></span>
        <h1 id="heading">Tiro Settings</h1>
      </header>
      <label class="field">
        <span id="label-owner">GitHub owner</span>
        <input
          id="owner"
          class="mono"
          placeholder="your GitHub username"
          autocomplete="off"
        />
      </label>
      <label class="field">
        <span id="label-repo">Vault repository</span>
        <input
          id="repo"
          class="mono"
          placeholder="your vault repository name"
          autocomplete="off"
        />
      </label>
      <label class="field">
        <span id="label-branch">Branch</span>
        <input id="branch" class="mono" placeholder="main" autocomplete="off" />
      </label>
      <label class="field">
        <span id="label-token">Fine-grained personal access token</span>
        <input id="token" class="mono" type="password" autocomplete="off" />
      </label>
      <p id="token-hint" class="note hint">
        Scope the token to the vault repository only, with Contents: Read and
        write. It is stored in chrome.storage.local on this machine.
      </p>
      <label class="field">
        <span id="label-language">Language</span>
        <select id="language">
          <option value="auto">Auto (browser language)</option>
          <option value="en">English</option>
          <option value="zh">中文</option>
        </select>
      </label>
      <div class="actions row">
        <button id="save" type="button" class="btn btn-primary">Save</button>
        <button id="test" type="button" class="btn btn-secondary">
          Test connection
        </button>
      </div>
      <p id="result" role="status"></p>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>

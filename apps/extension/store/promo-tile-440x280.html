<!doctype html>
<meta charset="utf-8" />
<style>
  /* Rendered over file:// by headless Chrome (see README.md); the fonts come
     from the extension's own node_modules, the same files the popup ships. */
  @font-face {
    font-family: "Spectral";
    font-weight: 600;
    src: url("../node_modules/@fontsource/spectral/files/spectral-latin-600-normal.woff2")
      format("woff2");
  }
  @font-face {
    font-family: "Spectral";
    font-weight: 400;
    src: url("../node_modules/@fontsource/spectral/files/spectral-latin-400-normal.woff2")
      format("woff2");
  }
  html,
  body {
    margin: 0;
    padding: 0;
    width: 440px;
    height: 280px;
    overflow: hidden;
  }
  body {
    font-family: "Spectral", Georgia, serif;
    background:
      radial-gradient(
        360px 240px at 82% 18%,
        rgba(143, 47, 47, 0.18),
        transparent 62%
      ),
      radial-gradient(
        300px 220px at 10% 92%,
        rgba(143, 47, 47, 0.1),
        transparent 62%
      ),
      #f4efe4;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 34px;
    box-sizing: border-box;
    color: #1e1b16;
  }
  /* A promo tile is read at a glance and often at half size, so it carries the
     mark and four words rather than a description. */
  img {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    margin-bottom: 20px;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.015em;
  }
  p {
    margin: 0;
    font-size: 16px;
    line-height: 1.4;
    color: #5a544a;
  }
  b {
    font-weight: 600;
    color: #8f2f2f;
  }
</style>
<!-- The SVG, not icon-128.png: that file carries the store listing's 16px
     transparent padding, which would render the mark inset here. -->
<img src="../icons/icon.svg" alt="" />
<h1>Tiro Clipper</h1>
<p>Save any page as Markdown,<br />straight into <b>your own</b> GitHub repo.</p>

name: Release

# Cutting a release: in one commit, bump the version in
# apps/extension/manifest.json and roll CHANGELOG.md to a matching
# `## [<version>]` section, then push a `v<version>` tag. One version covers
# the whole repo (ADR 0056); the clipper zip is this release's only asset.
# The `ext-v*` tags before 0.19.0 are the clipper's old separate line, kept
# because clips name them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Unlike CI, this job publishes a GitHub Release, so it needs write access to
# contents. It still never pushes commits, and credentials stay out of the
# workspace.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build extension
        run: bun run --cwd apps/extension build

      # manifest.json holds the only version string in the repo — no
      # package.json has one — so a tag that disagrees with it would ship a
      # zip whose real version is a surprise, and a version CHANGELOG.md has no
      # section for would ship a release with no notes. Fail before publishing
      # anything; a dry run from workflow_dispatch only warns.
      - name: Check the tag matches the manifest and the changelog
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          manifest_version="$(jq -r .version apps/extension/dist/manifest.json)"
          echo "version=$manifest_version" >> "$GITHUB_OUTPUT"
          has_section=0
          if awk -v v="$manifest_version" \
            'index($0, "## [" v "]") == 1 { found = 1 } END { exit !found }' \
            CHANGELOG.md; then
            has_section=1
          fi
          case "$REF" in
            refs/tags/v*)
              tag_version="${REF_NAME#v}"
              if [ "$tag_version" != "$manifest_version" ]; then
                echo "::error::tag $REF_NAME implies version $tag_version but the manifest says $manifest_version"
                exit 1
              fi
              if [ "$has_section" != 1 ]; then
                echo "::error::CHANGELOG.md has no [$manifest_version] section to publish as the release notes"
                exit 1
              fi
              ;;
            *)
              echo "Not a tag build ($REF_NAME); packaging manifest version $manifest_version."
              if [ "$has_section" != 1 ]; then
                echo "::warning::CHANGELOG.md has no [$manifest_version] section yet; a tag would fail here"
              fi
              ;;
          esac

      # The release notes are the version's CHANGELOG section, from its
      # heading to the next one (or the link footer, for the oldest), with the
      # section's compare link after it. Runs on a dry run too, so
      # workflow_dispatch exercises it before a tag depends on it.
      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "The Tiro Clipper for this release is \`tiro-clipper-$VERSION.zip\` below. Install it from the Chrome Web Store, or unzip it into a permanent folder and load it unpacked from chrome://extensions (Developer mode → Load unpacked). See docs/operations.md for setup."
            echo
            echo "---"
            echo
            awk -v v="$VERSION" '
              index($0, "## [" v "]") == 1 { on = 1; next }
              on && (/^## \[/ || /^\[[^ ]*\]: http/) { exit }
              on { lines[n++] = $0 }
              END {
                s = 0
                while (s < n && lines[s] ~ /^[[:space:]]*$/) s++
                e = n - 1
                while (e >= s && lines[e] ~ /^[[:space:]]*$/) e--
                for (i = s; i <= e; i++) print lines[i]
              }
            ' CHANGELOG.md
            link="$(awk -v v="$VERSION" \
              'index($0, "[" v "]: ") == 1 { print substr($0, length(v) + 5); exit }' \
              CHANGELOG.md)"
            if [ -n "$link" ]; then
              echo
              echo "**Full changelog**: $link"
            fi
          } > "$notes"
          cat "$notes"

      # Zip the *contents* of dist/, not the directory: Chrome and the Web
      # Store both require manifest.json at the root of the archive.
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd apps/extension/dist
          zip -qr "$RUNNER_TEMP/tiro-clipper-$VERSION.zip" . -x '.DS_Store' '**/.DS_Store'
          unzip -l "$RUNNER_TEMP/tiro-clipper-$VERSION.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: tiro-clipper-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/tiro-clipper-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$REF_NAME" \
            "$RUNNER_TEMP/tiro-clipper-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tiro $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

name: Release extension

# Cutting a release: bump the version in apps/extension/manifest.json, commit,
# then push a matching `ext-v<version>` tag. The `ext-` prefix keeps extension
# releases distinct from repo-level tags like v0.1.0.
on:
  push:
    tags: ["ext-v*"]
  workflow_dispatch:

# Unlike CI, this job publishes a GitHub Release, so it needs write access to
# contents. It still never pushes commits, and credentials stay out of the
# workspace.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build extension
        run: bun run --cwd apps/extension build

      # manifest.json holds the only version string in the repo — neither
      # package.json has one — so a tag that disagrees with it would ship a
      # zip whose real version is a surprise. Fail before publishing anything.
      - name: Check the tag matches the manifest version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest_version="$(jq -r .version apps/extension/dist/manifest.json)"
          echo "version=$manifest_version" >> "$GITHUB_OUTPUT"
          case "$REF_NAME" in
            ext-v*)
              tag_version="${REF_NAME#ext-v}"
              if [ "$tag_version" != "$manifest_version" ]; then
                echo "::error::tag $REF_NAME implies version $tag_version but the manifest says $manifest_version"
                exit 1
              fi
              ;;
            *)
              echo "Not a tag build ($REF_NAME); packaging manifest version $manifest_version."
              ;;
          esac

      # Zip the *contents* of dist/, not the directory: Chrome and the Web
      # Store both require manifest.json at the root of the archive.
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd apps/extension/dist
          zip -qr "$RUNNER_TEMP/tiro-clipper-$VERSION.zip" . -x '.DS_Store' '**/.DS_Store'
          unzip -l "$RUNNER_TEMP/tiro-clipper-$VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: tiro-clipper-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/tiro-clipper-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/ext-v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$REF_NAME" \
            "$RUNNER_TEMP/tiro-clipper-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tiro Clipper $VERSION" \
            --generate-notes \
            --notes "Unzip into a permanent folder, then load it unpacked from chrome://extensions (Developer mode → Load unpacked). See docs/operations.md for setup."

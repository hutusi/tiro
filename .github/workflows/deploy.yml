name: Deploy site

on:
  push:
    branches: [main]
    # Only what the site build reads. A docs, processor or extension commit
    # cannot change a page, and the vault's own changes arrive through the
    # dispatch below, so neither needs a rebuild here. A path missing from
    # this list holds a site change back until the next vault dispatch or a
    # manual run.
    paths:
      - apps/site/**
      - packages/shared/**
      - package.json
      - bun.lock
      - tsconfig.base.json
      - .github/workflows/deploy.yml
  # Fired by tiro-vault's process.yml after it commits processed articles.
  repository_dispatch:
    types: [vault-updated]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

# The deploy builds and uploads to Cloudflare — it never pushes to git, so
# the token stays read-only and neither checkout persists credentials.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A healthy run takes about two minutes. Without a limit a hung build
    # holds the deploy concurrency group for GitHub's six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # VAULT_READ_TOKEN (fine-grained PAT, tiro-vault, Contents: read) is
      # only required if the vault repo is private.
      - uses: actions/checkout@v7
        with:
          repository: hutusi/tiro-vault
          path: vault
          token: ${{ secrets.VAULT_READ_TOKEN || github.token }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Build site from the vault
        env:
          TIRO_VAULT_DIR: ${{ github.workspace }}/vault
        run: bun run --cwd apps/site build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/site/dist --project-name=tiro

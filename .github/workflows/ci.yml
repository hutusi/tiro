name: CI

on:
  pull_request:
  push:
    branches: [main]

# CI only lints, typechecks, tests, and builds — it never pushes, so the
# token stays read-only and is not persisted into the workspace.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
